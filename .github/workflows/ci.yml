name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -v

  # The engine bundle and Champions data are committed; make sure they match
  # what js/ builds so nobody edits them by hand or forgets to rebuild.
  generated-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - name: Check generated files are up to date
        run: git diff --exit-code -- src/champcalc/data || (echo "::error::Run 'npm run build' in js/ and commit the result" && exit 1)
